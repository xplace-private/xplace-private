include:
  - project: 'development/placex/ci-templates'
    ref: werfnew
    file: "werf.yaml"

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - unknown_failure

workflow:
  auto_cancel:
    on_new_commit: conservative
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUEST_EXISTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/
    - if: $CI_COMMIT_BRANCH == "production"

stages:
  - test
  - build
  - deploy
  - cleanup

.node:
  stage: test
  image: node:24-slim
  tags: [ dev-runner ]
  interruptible: true
  variables:
    # UID 1000: HOME образа недоступен, а каталог проекта на клоне ещё не создан.
    HOME: $CI_BUILDS_DIR
    PNPM_HOME: $CI_PROJECT_DIR/.pnpm
    PNPM_STORE: $CI_PROJECT_DIR/.pnpm-store
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
    policy: pull
  before_script:
    - export PATH="$PNPM_HOME/bin:$PATH"
    - npm install -g --prefix "$PNPM_HOME" "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
    - pnpm install --frozen-lockfile --store-dir "$PNPM_STORE"
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

typecheck:
  extends: .node
  script:
    - pnpm typecheck

lint:
  extends: .node
  script:
    - pnpm lint

test:
  extends: .node
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
    policy: pull-push
  script:
    - pnpm exec vitest run --reporter=default --reporter=junit --outputFile.junit=junit.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml
    expire_in: 1 week

helm:render:
  extends: .werf
  stage: test
  # helm lint на пропущенный required отвечает кодом 0, render — падает.
  script:
    - werf render --stub-tags --values .helm/values.development.yaml > /dev/null
    - werf render --stub-tags --values .helm/values.stage.yaml > /dev/null
    - werf render --stub-tags --values .helm/values.production.yaml > /dev/null
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

build:
  extends: .werf
  stage: build
  needs: []
  script:
    - werf build
  rules:
    - if: ($CI_COMMIT_BRANCH =~ /^release\/.*/ || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\/.*/ || $CI_COMMIT_BRANCH == "production" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "production") && $CI_PIPELINE_SOURCE != "schedule"
      variables:
        BUILD_MODE: staging
    - if: $CI_PIPELINE_SOURCE != "schedule"
      variables:
        BUILD_MODE: dev

.deploy:
  extends: .werf
  stage: deploy
  interruptible: false
  resource_group: $CI_ENVIRONMENT_NAME
  timeout: 20m
  before_script:
    - !reference [ .werf, before_script ]
    - ': "${CI_DEPLOY_USER:?deploy token gitlab-deploy-token is missing in the project}"'
    - ': "${CI_DEPLOY_PASSWORD:?deploy token gitlab-deploy-token is missing in the project}"'
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_DEPLOY_USER\",\"password\":\"$CI_DEPLOY_PASSWORD\"}}}" > dockerconfig.json
    - export WERF_SET_DOCKERCONFIG_JSON=dockerconfig=$( cat dockerconfig.json | base64 -w 0 )

.route-check:
  # converge does not track HTTPRoute: a name that does not match a gateway listener
  # still deploys green while the route stays Accepted=False.
  script:
    - |
      ns="private-frontend-$CI_ENVIRONMENT_SLUG"
      for route in $(werf kubectl -n "$ns" get httproute -o name); do
        accepted=$(werf kubectl -n "$ns" get "$route" \
          -o jsonpath='{.status.parents[*].conditions[?(@.type=="Accepted")].status}')
        case "$accepted" in
          ""|*False*) echo "$route is not accepted by the gateway: '$accepted'"; exit 1 ;;
        esac
        echo "$route accepted"
      done

deploy:development:
  extends: .deploy
  variables:
    BUILD_MODE: dev
  script:
    - werf kubectl config use-context development/placex/k8s-agents:k8s-main
    - werf converge --values .helm/values.development.yaml
    - !reference [ .route-check, script ]
  environment:
    name: development
    url: https://private-frontend.dev.kube-main.x.place
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

deploy:stage:
  extends: .deploy
  variables:
    BUILD_MODE: staging
  script:
    - werf kubectl config use-context development/placex/k8s-agents:k8s-main
    - werf converge --values .helm/values.stage.yaml
    - !reference [ .route-check, script ]
  environment:
    name: stage
    url: https://private-frontend.stage.kube-main.x.place
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/ && $CI_PIPELINE_SOURCE != "schedule"

deploy:production:
  extends: .deploy
  # Production points at the stage backend (DEV-2939), so it builds in the same mode.
  variables:
    BUILD_MODE: staging
  script:
    - werf kubectl config use-context development/placex/k8s-agents:k8s-production
    - werf converge --values .helm/values.production.yaml
    - !reference [ .route-check, script ]
  after_script:
    - |
      TITLE=$(printf '%s' "$CI_COMMIT_TITLE" | sed 's/\\/\\\\/g; s/"/\\"/g')
      AUTHOR=$(printf '%s' "$CI_COMMIT_AUTHOR" | sed 's/\\/\\\\/g; s/"/\\"/g')
      COMMIT_LINK="<$CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA|$TITLE>"
      if [ "$CI_JOB_STATUS" = "success" ]; then
        TEXT="✅ Private frontend задеплоен в prod\nКоммит: \`$CI_COMMIT_SHORT_SHA\` $COMMIT_LINK\nАвтор: $AUTHOR"
      elif [ "$CI_JOB_STATUS" = "canceled" ]; then
        TEXT="⚠️ Деплой private frontend в prod отменён\nКоммит: \`$CI_COMMIT_SHORT_SHA\` $COMMIT_LINK\nАвтор: $AUTHOR"
      else
        TEXT="❌ Деплой private frontend в prod упал\nКоммит: \`$CI_COMMIT_SHORT_SHA\` $COMMIT_LINK\nАвтор: $AUTHOR"
      fi
      curl -s -X POST "$SLACK_WEBHOOK_DEV_RELEASES" \
        -H "Content-Type: application/json" \
        -d "{\"text\": \"$TEXT\"}"
  environment:
    name: production
    url: https://wise-wolves.x.place
  rules:
    - if: $CI_COMMIT_BRANCH == "production" && $CI_PIPELINE_SOURCE != "schedule"
