log_format json escape=json '{"time":"$time_iso8601","status":$status,'
    '"method":"$request_method","uri":"$uri","bytes":$body_bytes_sent,'
    '"rt":$request_time,"ua":"$http_user_agent",'
    '"request_id":"$http_x_request_id","xff":"$http_x_forwarded_for"}';

map $status $loggable {
    ~^[23]  0;
    default 1;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log json;

    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # В /assets/ лежат и хешированные бандлы, и файлы из public/ без хеша.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
        include /etc/nginx/security-headers.conf;
        # always повесил бы immutable и на 404.
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 404 здесь — это протухший чанк у открытой вкладки, попадания в кеш — шум.
        access_log /var/log/nginx/access.log json if=$loggable;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # types на уровне server перекрыл бы общий mime.types.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # One config ships to every environment, so every environment's API origin is listed.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://backend.dev.kube-main.x.place https://backend.stage.kube-main.x.place https://back-stage.x.place https://back.x.place; font-src 'self' data:; connect-src 'self' https://backend.dev.kube-main.x.place https://back-stage.x.place https://back.x.place https://distributions.crowdin.net https://o4509822456692736.ingest.us.sentry.io; frame-src 'self' https://*.sumsub.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
