add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy 'camera=(self "https://api.sumsub.com" "https://in.sumsub.com"), microphone=(self "https://api.sumsub.com" "https://in.sumsub.com"), geolocation=(self "https://api.sumsub.com" "https://in.sumsub.com"), clipboard-write=(self "https://api.sumsub.com"), hid=(self "https://api.sumsub.com"), payment=()' always;
